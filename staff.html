<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pride Center – Staff Dashboard</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #d61f26; --ink: #2f2f2f; --muted: #6f6f6f; --bg: #f6f6f7; --panel: #fff; --line: #e6e6e8;
    --bar: #6b7a90;
    --m-red: #c1272d; --m-yellow: #eda232; --m-blue: #2b5090; --m-green: #4c9a47;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Fredoka", "Avenir Next", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header img { height: 44px; }
  header h1 { margin: 0; font-size: 1.35rem; font-weight: 600; color: var(--red); }
  header .spacer { flex: 1; }
  header select, header button, .gate button, .gate input {
    font: inherit; font-size: 1rem; padding: 9px 14px; border: 1px solid #cfcfd3; border-radius: 10px; background: #fff; color: var(--ink);
  }
  header button, .gate button { cursor: pointer; }
  header button.primary, .gate button { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; }
  .note { color: var(--muted); font-size: 0.95rem; margin: 0 0 14px; }
  .note.err { color: #b00020; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .tile .k { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
  .tile .v { font-size: 2rem; font-weight: 600; line-height: 1.1; margin-top: 2px; }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .chart h3 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 0.92rem; margin: 6px 0; }
  .row .lbl { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { grid-column: 1 / -1; height: 10px; background: #eeeef0; border-radius: 6px; overflow: hidden; }
  .row .fill { height: 100%; background: var(--bar); border-radius: 6px; }
  .row .n { font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 0.9rem; }

  .table { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: #fafafa; font-weight: 600; color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; color: #fff; }
  .g-Red { background: var(--m-red); } .g-Yellow { background: var(--m-yellow); color: #2b1d00; } .g-Blue { background: var(--m-blue); } .g-Green { background: var(--m-green); }
  .o-Incident { color: #b00020; font-weight: 600; } .o-Basic { color: #2f6b30; font-weight: 600; }

  .gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .gate form { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 30px; width: min(92vw, 380px); text-align: center; }
  .gate img { height: 80px; }
  .gate h2 { margin: 8px 0 4px; font-weight: 600; }
  .gate p { color: var(--muted); margin: 0 0 16px; }
  .gate input { width: 100%; text-align: center; font-size: 1.4rem; letter-spacing: 0.3em; margin-bottom: 12px; }
  .gate button { width: 100%; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <img src="assets/panther.png" alt="">
  <h1>Pride Center · Staff Dashboard</h1>
  <div class="spacer"></div>
  <select id="range">
    <option value="today">Today</option>
    <option value="yesterday">Yesterday</option>
    <option value="week">This week</option>
    <option value="all">All loaded</option>
  </select>
  <button id="refresh" type="button">↻ Refresh</button>
  <button id="csv" type="button">⬇ CSV</button>
  <button id="lock" type="button">Lock</button>
</header>

<main>
  <div class="gate" id="gate">
    <form id="pinForm">
      <img src="assets/panther.png" alt="">
      <h2>Staff only</h2>
      <p>Enter the staff PIN to view check-ins.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <button type="submit">Open dashboard</button>
      <p id="pinErr" class="note err"></p>
    </form>
  </div>

  <div id="dash" class="hidden">
    <p class="note" id="status"></p>
    <div class="tiles" id="tiles"></div>
    <div class="charts" id="charts"></div>
    <div class="table">
      <table>
        <thead><tr>
          <th>Time</th><th>Name / ID</th><th>Reason</th><th>Energy</th><th>Mood</th><th>What happened</th><th>Outcome</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  const CFG = Object.assign({ SCRIPT_URL: "", DASHBOARD_DAYS: 14 }, window.PPC_CONFIG || {});
  const $ = s => document.querySelector(s);
  let all = [];
  let pin = sessionStorage.getItem("ppc_pin") || "";

  const REASONS  = ["Sent by a teacher or staff", "Scheduled Break", "Drop In: I need a reset", "Drop In: I have a need"];
  const ENERGY   = ["Moving Fast", "Moving Slow", "Moving Ok"];
  const MOODS    = ["Red", "Yellow", "Blue", "Green"];
  const HAPPENED = ["At Home", "With my Teacher", "With a friend", "Just with myself"];
  const OUTCOMES = ["Check In", "Incident Report", "Basic Need"];
  const MOOD_COLORS = { Red: "var(--m-red)", Yellow: "var(--m-yellow)", Blue: "var(--m-blue)", Green: "var(--m-green)" };

  // ---- Auth gate ----
  $("#pinForm").addEventListener("submit", async e => {
    e.preventDefault();
    pin = $("#pin").value.trim();
    $("#pinErr").textContent = "";
    const ok = await load();
    if (ok) { sessionStorage.setItem("ppc_pin", pin); openDash(); }
  });
  $("#lock").addEventListener("click", () => { sessionStorage.removeItem("ppc_pin"); location.reload(); });
  function openDash() { $("#gate").classList.add("hidden"); $("#dash").classList.remove("hidden"); }

  // ---- Data ----
  async function load() {
    $("#status").textContent = "Loading…";
    if (!CFG.SCRIPT_URL) {
      // Test mode: read what index.html saved on this same device.
      try { all = JSON.parse(localStorage.getItem("ppc_local") || "[]"); } catch { all = []; }
      $("#status").textContent = "Test mode: showing check-ins saved on this device only. Set SCRIPT_URL in config.js to read the Google Sheet.";
      render(); return true;
    }
    try {
      const url = `${CFG.SCRIPT_URL}?pin=${encodeURIComponent(pin)}&days=${CFG.DASHBOARD_DAYS}&_=${Date.now()}`;
      const res = await fetch(url, { redirect: "follow" });
      const data = await res.json();
      if (!data.ok) { $("#pinErr").textContent = data.error || "Could not load."; $("#status").textContent = ""; return false; }
      all = data.rows || [];
      $("#status").textContent = `Loaded ${all.length} check-ins from the last ${data.days} days · updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      render(); return true;
    } catch (err) {
      $("#pinErr").textContent = "Could not reach the Google Sheet. Check SCRIPT_URL and your connection.";
      $("#status").textContent = ""; return false;
    }
  }

  function inRange(ts) {
    const d = new Date(ts), now = new Date();
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const today = day(now);
    switch ($("#range").value) {
      case "today":     return day(d) === today;
      case "yesterday": return day(d) === today - 86400000;
      case "week": {
        const dow = (now.getDay() + 6) % 7; // Monday = 0
        return day(d) >= today - dow * 86400000;
      }
      default: return true;
    }
  }

  // ---- Render ----
  function count(rows, key, order) {
    const m = {}; rows.forEach(r => { const k = r[key] || "(blank)"; m[k] = (m[k] || 0) + 1; });
    const keys = order ? order.filter(k => k in m).concat(Object.keys(m).filter(k => !order.includes(k))) : Object.keys(m).sort((a, b) => m[b] - m[a]);
    return keys.map(k => [k, m[k]]);
  }
  function bars(title, pairs, colorFn) {
    const max = Math.max(1, ...pairs.map(p => p[1]));
    const body = pairs.length ? pairs.map(([k, n]) => `
      <div class="row">
        <div class="lbl">${esc(k)}</div><div class="n">${n}</div>
        <div class="track"><div class="fill" style="width:${(n / max * 100).toFixed(1)}%;${colorFn ? "background:" + colorFn(k) : ""}"></div></div>
      </div>`).join("") : `<div class="empty">No check-ins in this range.</div>`;
    return `<div class="chart"><h3>${title}</h3>${body}</div>`;
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function render() {
    const rows = all.filter(r => inRange(r.timestamp)).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const n = rows.length;
    const by = k => rows.filter(r => r.outcome === k).length;
    const uniq = new Set(rows.map(r => String(r.name || "").trim().toLowerCase())).size;
    $("#tiles").innerHTML = [
      ["Check-ins", n], ["Students", uniq], ["Check In", by("Check In")], ["Incident Reports", by("Incident Report")], ["Basic Needs", by("Basic Need")]
    ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

    $("#charts").innerHTML =
      bars("Why they came", count(rows, "reason", REASONS)) +
      bars("Energy", count(rows, "energy", ENERGY)) +
      bars("Mood group", count(rows, "moodGroup", MOODS), k => MOOD_COLORS[k] || "var(--bar)") +
      bars("What happened", count(rows, "happened", HAPPENED)) +
      bars("Top feelings", count(rows, "moodWord").slice(0, 8));

    $("#tbody").innerHTML = rows.length ? rows.map(r => {
      const t = new Date(r.timestamp);
      const when = $("#range").value === "today"
        ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        : t.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      const oc = r.outcome === "Incident Report" ? "o-Incident" : r.outcome === "Basic Need" ? "o-Basic" : "";
      return `<tr>
        <td>${esc(when)}</td><td>${esc(r.name)}</td><td>${esc(r.reason)}</td><td>${esc(r.energy)}</td>
        <td>${r.moodGroup ? `<span class="pill g-${esc(r.moodGroup)}">${esc(r.moodWord)}</span>` : ""}</td>
        <td>${esc(r.happened)}</td><td class="${oc}">${esc(r.outcome)}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="7" class="empty">No check-ins in this range.</td></tr>`;
  }

  // ---- CSV export of the current view ----
  $("#csv").addEventListener("click", () => {
    const rows = all.filter(r => inRange(r.timestamp));
    const cols = ["timestamp", "name", "reason", "energy", "moodGroup", "moodWord", "happened", "need", "outcome", "kiosk"];
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => q(r[c])).join(","))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `pride-center-checkins-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  });

  $("#range").addEventListener("change", render);
  $("#refresh").addEventListener("click", load);
  setInterval(() => { if (!$("#dash").classList.contains("hidden")) load(); }, 60000);

  // Auto-open if a PIN is remembered for this browser tab (or in test mode).
  if (pin || !CFG.SCRIPT_URL) load().then(ok => { if (ok) openDash(); });
})();
</script>
</body>
</html>
